<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discovery Options Finder</title>
<style>
:root{
  --navy:#000f46; --navy-2:#0b2160; --ink:#14182b; --ink-2:#4a5068; --ink-3:#6b7189;
  --line:#dde1ea; --line-2:#c9cfdc; --bg:#f6f7fa; --card:#ffffff;
  --accent:#0a6fb8; --accent-soft:#e7f1fa; --gold:#c9a227;
  --ok:#1d7a4c; --warn:#9a5b00; --warn-soft:#fdf3e2;
  --radius:10px; --shadow:0 1px 2px rgba(10,20,60,.06),0 4px 14px rgba(10,20,60,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

header.top{background:var(--navy);color:#fff;padding:22px 24px 0}
.top h1{margin:0;font-size:24px;letter-spacing:-.01em}
.top p{margin:6px 0 18px;color:#c7cde0;max-width:62ch}
.years{display:flex;gap:4px}
.years button{background:transparent;border:0;color:#c7cde0;padding:10px 18px 12px;border-radius:8px 8px 0 0;font-weight:600;font-size:15px}
.years button[aria-selected=true]{background:var(--bg);color:var(--navy)}
.years button:hover:not([aria-selected=true]){color:#fff;background:rgba(255,255,255,.08)}
.years .n{font-weight:400;opacity:.7;margin-left:4px}

.wrap{display:grid;grid-template-columns:260px 1fr;gap:24px;padding:20px 24px 120px;max-width:1280px;margin:0 auto}
aside{align-self:start;position:sticky;top:12px}
.search{width:100%;padding:10px 12px;border:1px solid var(--line-2);border-radius:8px;font:inherit;background:#fff}
fieldset{border:0;padding:0;margin:18px 0 0}
legend{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700;margin-bottom:8px;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:4px 10px;font-size:13px;line-height:1.35}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip:hover:not([aria-pressed=true]){border-color:var(--navy)}
.chip .c{opacity:.6;margin-left:3px}
.chip:disabled{opacity:.4;cursor:default}
.subleg{font-size:12px;color:var(--ink-3);margin:10px 0 6px}
.reset{margin-top:18px;background:none;border:0;color:var(--accent);padding:0;text-decoration:underline}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.count{color:var(--ink-2)}
.count b{color:var(--ink)}
.togglef{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.ch{padding:16px 16px 0}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.pill{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:4px;background:#eef0f5;color:var(--ink-2)}
.pill.dt{background:var(--accent-soft);color:#08548c}
.pill.fs{background:#efeaf8;color:#4b2d8a}
.pill.tbc{background:var(--warn-soft);color:var(--warn)}
.card h3{margin:0 0 6px;font-size:17px;line-height:1.3;color:var(--navy)}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13.5px;margin:10px 0;color:var(--ink-2)}
.facts dt{color:var(--ink-3)}
.facts dd{margin:0;color:var(--ink)}
.desc{font-size:14px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin:12px 0 0}
.tag{font-size:12px;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
.cf{margin-top:auto;padding:14px 16px;display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);margin-top:14px}
.btn{border:1px solid var(--line-2);background:#fff;border-radius:7px;padding:6px 12px;font-size:14px;font-weight:600}
.btn:hover{border-color:var(--navy)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-2)}
.cmp{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-2)}
.cmp input{width:17px;height:17px;accent-color:var(--accent)}
.empty{background:#fff;border:1px dashed var(--line-2);border-radius:var(--radius);padding:36px;text-align:center;color:var(--ink-2)}

.tray{position:fixed;left:0;right:0;bottom:0;background:var(--navy);color:#fff;padding:12px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;transform:translateY(110%);transition:transform .2s}
.tray.on{transform:none}
.tray .names{flex:1;min-width:200px;font-size:14px;color:#dfe3f0}
.tray .btn{border-color:#fff;color:var(--navy)}
.tray .btn:disabled{opacity:.6;cursor:default}
.tray .btn.ghost{background:transparent;color:#fff}

dialog{border:0;border-radius:12px;padding:0;width:min(1100px,96vw);max-height:92vh;box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(5,12,40,.55)}
.dh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.dh h2{margin:0;font-size:19px;color:var(--navy)}
.x{background:none;border:0;font-size:26px;line-height:1;padding:2px 8px;color:var(--ink-2)}
.db{padding:4px 20px 20px;overflow:auto;max-height:calc(92vh - 64px)}
.detail h4{margin:18px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.detail p{margin:0;white-space:pre-line}
table.ct{border-collapse:collapse;width:100%;font-size:14px;margin-top:12px}
.ct th,.ct td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}
.ct thead th{position:sticky;top:0;background:#fff;color:var(--navy);font-size:15px;border-bottom:2px solid var(--navy)}
.ct tbody th{color:var(--ink-3);font-weight:600;width:150px;font-size:13px;background:#fafbfc}
.ct td{white-space:pre-line;min-width:220px}
.ct .muted{color:var(--ink-3)}
.foot{font-size:12.5px;color:var(--ink-3);margin-top:24px}

@media (max-width:820px){
  .wrap{grid-template-columns:1fr;padding:16px 16px 120px}
  aside{position:static;display:none}
  aside.open{display:block}
  .togglef{display:inline-block}
  header.top{padding:18px 16px 0}
  .years button{padding:10px 12px 12px}
  .tray{padding:12px 16px}
}
@media (prefers-reduced-motion:reduce){.tray{transition:none}}
</style>
</head>
<body>
<header class="top">
  <h1>Discovery Options Finder</h1>
  <p>Explore and compare the Discovery options available in each year of the MD. Filter by interest, delivery mode or location, then tick up to three options to compare them side by side.</p>
  <div class="years" role="tablist" aria-label="Year level" id="years"></div>
</header>

<div class="wrap">
  <aside id="filters" aria-label="Filters">
    <label class="sr" for="q">Search options</label>
    <input id="q" class="search" type="search" placeholder="Search by name or keyword…">
    <fieldset><legend>Option type</legend><div class="chips" id="f-type"></div></fieldset>
    <fieldset><legend>Delivery mode</legend><div class="chips" id="f-mode"></div></fieldset>
    <fieldset><legend>Where you'll be</legend><div class="chips" id="f-site"></div></fieldset>
    <fieldset><legend>Interests</legend><div id="f-tags"></div></fieldset>
    <button class="reset" id="reset" type="button">Clear all filters</button>
  </aside>

  <main>
    <div class="bar">
      <div class="count" id="count" aria-live="polite"></div>
      <button class="btn togglef" id="togglef" type="button" aria-expanded="false" aria-controls="filters">Filters</button>
    </div>
    <div class="grid" id="grid"></div>
    <p class="foot" id="foot"></p>
  </main>
</div>

<div class="tray" id="tray" role="region" aria-label="Comparison selection">
  <div class="names" id="trayNames"></div>
  <button class="btn ghost" id="clearCmp" type="button">Clear</button>
  <button class="btn" id="openCmp" type="button">Compare</button>
</div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <div class="dh"><h2 id="dlgTitle"></h2><button class="x" id="dlgClose" type="button" aria-label="Close">×</button></div>
  <div class="db" id="dlgBody"></div>
</dialog>

<script>
const DATA = {"options": [{"id": "D1-DEATH", "name": "Death and Dying: Lifting the Lid", "years": ["MD1"], "type": "Discovery Topic", "status": "Available", "desc": "This topics explores diverse issues surrounding death and dying in contemporary Australia. Students consider medical knowledge alongside broader socio-cultural and religious contexts, to bridge the gap between our healthcare and deathcare systems. Students will develop compassion and understanding for the diversity of human responses to death, from end-of-life through to funerals and bereavement. The topic of death and dying is ideally suited for students interested in patient-centred and compassionate healthcare, but will provide a solid foundation for all specialities.", "tags": ["Palliative & end-of-life care"], "mode": "Online", "location": "Online", "sites": ["Online"], "period": "MD1 12-week Discovery block (Apr–Jul)", "commitment": "A combination of synchronous and asynchronous online learning, independent learning and voluntary site visits. Weekly breakdown of learning activities: 1 hour weekly online tutorial, 2 hours asynchronous online learning and 5 hours independent activities. In addition, 1 hour of site visits (voluntary).", "assessment": "Debate;  2 x Essays (book/film review & written film reflection); Reflective journal", "prereq": "None", "travel": "None", "rural": "Join online", "costs": "", "pairs": "", "prep": "Death & Dying 2", "link": ""}, {"id": "D1-DISASTER", "name": "Disaster Medicine: Principles and Responses", "years": ["MD1"], "type": "Discovery Topic", "status": "Available", "desc": "As both natural disasters and terror events become more frequent around the world, it is vital health practitioners are prepared to respond quickly and decisively. This subject explores the essential principles of disaster management, with a focus on prevention, preparedness, response, and recovery. You will gain a detailed understanding of the principles of disaster management, as well as key terminology, and different types of disasters and the hazards associated with them. You will explore the concepts of disaster command and control, and the structures and systems underpinning a disaster response and examine the impact disasters have on vulnerable communities and consider the role of healthcare worker resilience.", "tags": ["Emergency & disaster medicine", "Global & planetary health"], "mode": "Blended", "location": "Online and Parkville", "sites": ["Online", "Parkville"], "period": "MD1 12-week Discovery block (Apr–Jul or Jun-Sept)", "commitment": "Material will be delivered in asynchronous online modules coupled with weekly online tutorials and a face-to-face workshop in week 11. Weekly breakdown of learning activities: 5-6 hours of reading, 2 hours of online activities and discussion. A one-hour tutorial each week.", "assessment": "Group oral presentation; Written report; Discussion board reflection portfolio", "prereq": "None", "travel": "To Parkville", "rural": "Travel to Parkville", "costs": "Self-funded", "pairs": "", "prep": "", "link": ""}, {"id": "D1-CANCER", "name": "Discover Cancer", "years": ["MD1"], "type": "Discovery Topic", "status": "Available", "desc": "This topic explores the fundamentals of cancer sciences through a clinical approach. Students will explore defining disease mechanisms on the basis of patient scenarios to directly contextualise real-world relevance in areas such as treatment and pathology. The Discover Cancer topic is ideally suited to students with an interest in cancer care at all levels of the patient journey, as well as those who want to dig deeper in the biomedical science and pathology of cancer.", "tags": ["Oncology & cancer care"], "mode": "Online", "location": "Online", "sites": ["Online"], "period": "MD1 12-week Discovery block (Apr–Jul)", "commitment": "A combination of synchronous and asynchronous online learning, independent learning and one site visit. Weekly breakdown of learning activities: 4 hours asynchronous online learning and 6 hours independent activities. In addition, 4 x 2 hour synchronous online tutorials and 2 hours of site visit (where possible).", "assessment": "Video presentation; Written report; Discussion board portfolio", "prereq": "None", "travel": "None", "rural": "Join online", "costs": "", "pairs": "Advanced Cancer Diagnostics", "prep": "", "link": ""}, {"id": "D1-RESEARCH", "name": "Reviewing and Communicating Research", "years": ["MD1"], "type": "Discovery Topic", "status": "Available", "desc": "This topic extends on the knowledge gained in the Foundations for Clinical Practice Research Methods units by providing students with the opportunity to further their skills in the comprehension of medical research and communicating research findings. Familiarity with research methods and the presentation of research findings is built through guided discussions of research topics and research papers (hybrid option for rural students). These learning activities are further enhanced through lectures from guest clinician-researchers (online learning) as well as two half day research placements. The research placements provide the opportunity to gain firsthand exposure to clinical translation medicine occurring across the Melbourne Medical School (including rural sites).", "tags": ["Research & research translation"], "mode": "Blended", "location": "Online and Parkville", "sites": ["Online", "Parkville"], "period": "MD1 12-week Discovery block (Apr–Jul)", "commitment": "A combination of synchronous and asynchronous learning with some site visits. Breakdown of learning activities: Weekly synchronous journal club (1.5 hours), a total of 8 hours of research placement (where possible) over the 12-week teaching period, and approximately 5 hours of independent activities per week.", "assessment": "Podcast; Research report; Reflective report", "prereq": "None", "travel": "None", "rural": "Join online", "costs": "", "pairs": "Translational Medicine", "prep": "Research Scholar", "link": ""}, {"id": "D1-RURAL", "name": "Rural Health: Foundations", "years": ["MD1"], "type": "Discovery Topic", "status": "Available", "desc": "Foundations of Rural Health is designed to spark your curiosity and deepen your understanding of what it really means to live and work in rural and remote Australia.\n\nThrough real-world case studies, authentic community stories, and interactive online learning, you’ll explore how health professionals create meaningful impact in settings where innovation, adaptability, and connections matter most.\n\nYou’ll examine how social, cultural, and environmental factors shape health and wellbeing in rural communities, and consider how you can contribute to improving access, equity, and culturally safe care. Each week includes guest presentations from people with lived rural experience, giving you genuine insight into the opportunities, challenges, and rewards of rural practice.\n\nBy the end of the subject, you’ll have a clearer sense of what a rural career could look like for you - whether as a doctor, health professional, or community advocate - along with a deeper appreciation for the people, places, and values that make rural health unique.\n\nThis subject is ideal for anyone curious about rural life, passionate about health equity, or seeking inspiration about the many pathways a rural career can offer.", "tags": ["Rural & regional health", "First Nations health"], "mode": "Online", "location": "Online", "sites": ["Online"], "period": "MD1 12-week Discovery block (Apr–Jul)", "commitment": "This subject is an asynchronous subject except for the weekly synchronous online tutorial on Monday afternoon. The remaining content can be completed at any time.", "assessment": "Team debates; Evaluation report; Video reflection", "prereq": "None", "travel": "None", "rural": "Join online", "costs": "", "pairs": "Integrated Rural Health", "prep": "", "link": ""}, {"id": "D1-SEXHEALTH", "name": "Sexual Health Across Clinical Contexts 1", "years": ["MD1"], "type": "Discovery Topic", "status": "Available", "desc": "This topic offers a clinical and practical discovery in Sexual Health Care. The focus is on developing excellent communication skills - emphasizing flexibility in different contexts, the avoidance of assumptions and the reduction of stigma. Knowledge of STIs including screening, diagnosis, management and partner notification is the second key part of this topic. This topic would be suited to those with an interest in sexual health (across most fields of medicine and surgery) and those who want to further their communication skills.", "tags": ["Sexual & reproductive health", "Clinical and communication skills"], "mode": "Blended", "location": "Online, Parkville and Shepparton", "sites": ["Online", "Parkville", "Shepparton"], "period": "MD1 12-week Discovery block (Apr–Jul)", "commitment": "This topic offers asynchronous learning and synchronous learning.  The synchronous learning involves 8 x 2 hr small group learning and lectures.  There are 4 x 1.5 hr tutorials  concentrated on the development of skills in sexual history taking and how to develop an inclusive practice.", "assessment": "Video submission; Written assessment; Reflective activity", "prereq": "None", "travel": "To Parkville or Shepparton", "rural": "Ballarat travel to Parkville; Regional travel to Shepparton", "costs": "Self-funded", "pairs": "Sexual Health in Clinical Contexts 2 and 3.", "prep": "", "link": ""}, {"id": "D2-EDUCATE", "name": "Becoming a Clinical Educator", "years": ["MD2"], "type": "Discovery Topic", "status": "Available", "desc": "Students engage in a structured program of microlearning to develop foundational knowledge of small group teaching, facilitation and feedback strategies relevant to early clinical teaching roles. They apply this learning through designing and delivering short, focused teaching and facilitation episodes (microteaching) in both classroom and clinical education settings. Microteaching aligns with the teaching responsibilities they are likely to undertake as senior medical students and junior doctors.\n\nAcross the subject, students participate in repeated microteaching opportunities in classroom and clinical settings, enabling them to practise structuring brief teaching interactions, engaging learners in small segments, and adapting their approach to different contexts using feedback to inform their development.", "tags": ["Medical education & teaching"], "mode": "To be confirmed", "location": "To be confirmed", "sites": [], "period": "MD2 4-week Discovery term (TBC)", "commitment": "This subject uses a blended, practice-based design, combining asynchronous microlearning, in-person teaching participation, and online workshops. \n\nIn person: Students attend MD1 Professional Practice and Clinical Skills classes at Parkville or Shepparton in Weeks 1–3 (~4 hours/week) and a half-day at their clinical school in Weeks 2–4 (~3.5–4 hours) to observe and undertake supervised microteaching in authentic classroom and clinical settings. \n\nAll other workshops and assessments (presentations) are online and usually scheduled for 1-2 hours on Mondays or Fridays.", "assessment": "Micro-teaching plan presentation; Lesson planning written assignment; Reflective portfolio", "prereq": "None", "travel": "To Parkville or Rural Clinical School", "rural": "Attend locally", "costs": "", "pairs": "", "prep": "", "link": ""}, {"id": "D2-DEATH", "name": "Death and Dying: When is Dead Really Dead", "years": ["MD2"], "type": "Discovery Topic", "status": "Available", "desc": "This topic focuses on the clinical aspects of managing the dying process and appropriate communication skills to support it. Students will gain an understanding of the diversity of views on death and dying in contemporary Australia from medical, socio-cultural and personal perspectives.   Modules will explore ethical decision making in end-of-life care, managing the deceased and communicating the complexity of taboos, fears and anxieties around death with patients and families.  Students do not need to have undertaken the Death and Dying Discovery 1 subject to enrol in Death and Dying 2.", "tags": ["Palliative & end-of-life care", "Clinical and communication skills"], "mode": "Blended", "location": "Online and Parkville", "sites": ["Online", "Parkville"], "period": "MD2 4-week Discovery term (TBC)", "commitment": "This topic includes synchronous and asynchronous learning.  Synchronous commitment includes 4 x 2 hour tutorials per week; 3 x 3 hour communication skills workshops.", "assessment": "Group oral presentation;Book and film review written assignment; Reflective portfolio", "prereq": "None", "travel": "None", "rural": "Join online", "costs": "", "pairs": "Death and Dying 1", "prep": "", "link": ""}, {"id": "D2-DEAFNESS", "name": "Deafness and hard of hearing: the Hidden Barrier to Communication", "years": ["MD2"], "type": "Discovery Topic", "status": "Available", "desc": "This topic explores deafness and those who are hard of hearing through a mixture of learning experiences including placements with Audiologists and Speech pathologists and attendance at Early Learning programmes and clinics at the Royal Victorian Eye and Ear Hospital. By the end of this topic, students will have knowledge about hearing assessments and the communication methods and devices available. Students will also gain an understanding of the impacts of hearing impairments for patients and their families.", "tags": ["Disability & equity", "Clinical and communication skills"], "mode": "Blended", "location": "Online, metro placement, rural placement", "sites": ["Online", "Metro placement / site", "Rural placement / site"], "period": "MD2 4-week Discovery term (TBC)", "commitment": "This topic includes synchronous and asynchronous learning.  The format is a mixture of online synchronous tutorials and learning, clinical placements at the Royal Victorian Eye and Ear Hospital (in East Melbourne), and several days of in person placements at Hearing Australia and at Early Learning Programmes (Hearing Australia Centres are located throughout metropolitan and rural areas and the Early Learning Programmes are in Sunshine North and Blackburn). For rural students, the placements will be in their hospital and in their town (there may be the opportunity to attend clinics and other placements in Melbourne if needed).\n\nSynchronous learning commitment includes 4 x 3.5 hour tutorials; 6-8 x full or half day placements.", "assessment": "Telehealth role play; Analysis written assignment; Reflective portfolio", "prereq": "None", "travel": "Multiple placement sites", "rural": "Attend locally", "costs": "", "pairs": "", "prep": "", "link": ""}, {"id": "D2-MHW", "name": "Making Healthcare Work: From Home to Hospital and Back Again", "years": ["MD2"], "type": "Discovery Topic", "status": "Available", "desc": "Are you still wondering how all the parts of the healthcare system actually work together? In this Discovery, you will explore patient journeys, effective care pathways and innovative healthcare initiatives, and you will build on your understanding of community (general practice) and hospital-based care environments.\n\nWe focus on understanding the roles and responsibilities in the systems including complexities of discharge processes, patient perspectives, and common clinical pitfalls in care transfer through immersive practical placements in both general practice and your home clinical school.  Teaching from subject matter experts in complex areas highlights how the health system works, including refugee health, dementia, trauma and cancer. We also explore upstream influences on health care including health system funding and leadership.", "tags": ["General Practice & primary care", "Health systems & care coordination"], "mode": "Blended", "location": "Online, Parkville, metro placement, rural placement", "sites": ["Online", "Parkville", "Metro placement / site", "Rural placement / site"], "period": "MD2 4-week Discovery term (TBC)", "commitment": "There are synchronous and asynchronous aspects to learning in this subject with clinical placements, teaching days and online modules via Canvas. \nTwo in person teaching days in weeks 1 and 4 in Parkville. Rural students will have the option of joining online. \nShort immersive 3 day placements in your home clinical school hospital and in general practice and suitable community-based health services in weeks 2 and 3. \nTwo optional Zoom check in sessions after hours in weeks 2 and 3 with subject co-ordinator.", "assessment": "Placement report; Health systems presentation; Reflective assignment", "prereq": "None", "travel": "None", "rural": "Join online", "costs": "", "pairs": "", "prep": "", "link": ""}, {"id": "D2-NM", "name": "Narrative Medicine", "years": ["MD2"], "type": "Discovery Topic", "status": "Available", "desc": "In this topic, students will develop skills in communication and storytelling. Through a series of writing workshops, students will develop skills of close listening, and begin to notice these stories in their healthcare settings, allowing them to become empathic, trauma-informed and skillful communicators. Students will learn the craft of writing and begin to explore the craft of writing through examining narratives, and will start building their own portfolio, across different styles of creative writing (including poetry, short story, personal essay and non-fiction).", "tags": ["Health humanities"], "mode": "Blended", "location": "Online and Parkville", "sites": ["Online", "Parkville"], "period": "MD2 4-week Discovery term (TBC)", "commitment": "The first 3 weeks of the Narrative Medicine subject includes online and in-person activities. A number of sessions are scheduled for attendance via Zoom, some are in person, and other work is done asynchronously online. Synchronous teaching includes: 1 x full day in person workshop in Week 1 and a 1 week intensive in person workshop in Parkville in Week 4. Weekly online workshops across the term.", "assessment": "Weekly learning journal; Poetry and oral reading; personal essay/ memoir; Weekly reflection portfolio", "prereq": "None", "travel": "To Parkville", "rural": "Travel to Parkville", "costs": "Self-funded", "pairs": "", "prep": "", "link": ""}, {"id": "D2-OC4H", "name": "On Country for Health", "years": ["MD2"], "type": "Discovery Topic", "status": "Available", "desc": "Explore and build your understanding of cultural safety and First Nations Health in a cultural immersion program. In this topic you’ll gain hands-on experience in a First Nations community, building your understanding of First Nations Heath through experiential learning. Learning experiences may include visits to key cultural sites, recognising local histories, participating in clinical placements & cultural activities. This topic contributes to building your understanding of cultural safety in health contexts.", "tags": ["First Nations health"], "mode": "Blended", "location": "Online and Shepparton", "sites": ["Online", "Shepparton"], "period": "MD2 4-week Discovery term (TBC)", "commitment": "Students will spend a week on Yorta Yorta Country for part of the topic. Attendance for the entire week (Monday AM to Friday PM) is compulsory and cannot be substituted for another activity. Students will be required to pay for and organise transportation to and from Shepparton. The accommodation is located 50 minutes from Shepparton in Moama. A bus will be provided during the week to get you between activities.  Weekly tutorials in weeks 1, 2, and 4 will be provided synchronously online.", "assessment": "Self-reflection learning plan; Oral presentation; Written portfolio assignment", "prereq": "None", "travel": "To Shepparton", "rural": "Travel to Shepparton", "costs": "Travel to Shepparton self-funded; On Country accommodation, travel, activities supported", "pairs": "", "prep": "", "link": ""}, {"id": "D2-SEXHEALTH", "name": "Sexual Health Across Clinical Contexts 2", "years": ["MD2"], "type": "Discovery Topic", "status": "Available", "desc": "Sexual Health Across Clinical Contexts (SHACC) extends a student's understanding through expanding knowledge, clinical and practical skills in Sexual Health Care.\n\nThis includes:\n- An exploration of interprofessional care learning from the following disciplines: Pharmacist, Occupational Therapist, General Practitioner, Nurse Practitioner in Sexual Health\n- Students of SHACC will also learn about caring for patients with complex needs including HIV, Gender affirming medicine, sexual dysfunction and addiction medicine.\n- Students will learn a full STI consultation in small groups learning history taking, examination, investigation, treatment and management.\n- Consent and capacity and mental health will be explored by a legal expert- a different view from the usual medical training.\n\nThis is supplemented by workshops on vulval dermatology, pain syndromes and arousal pathways which are important in pleasure and dysfunction.  A world first vulva examination tutorial is conducted with Clinical Teaching Associates.", "tags": ["Sexual & reproductive health", "Clinical and communication skills"], "mode": "In person", "location": "Parkville and Shepparton", "sites": ["Parkville", "Shepparton"], "period": "MD2 4-week Discovery term (TBC)", "commitment": "Sexual Health Across Clinical Contexts (SHACC) is taught with a combination of learning styles. In person (on campus) workshops and tutorials are spread across the topic with the number of days needed to attend onsite between 9 to 10 across the four weeks. Online group learning will be spread across the topic but mainly in weeks 1 & 4. The synchronous learning involves: 7 hours of lectures; 4 x 5-6 hour clinical skills tutorials; 3 x 2 hour workshops.\n\nThis course is delivered face to face in Shepparton for rural based students and in Parkville for Metropolitan based students. Ballarat rural students may be included in the Parkville cohort. Rural students are supported to be in Shepparton when required.  Timetabling is set to attempt to have rural students attending Shepparton for classes on consecutive days to minimise travel.", "assessment": "Referral letter; Modified OSCE;  Reflective portfolio", "prereq": "Students who have not completed SHACC in MD1 will be required to complete 2 online learning modules prior to commencing.", "travel": "To Parkville or Shepparton", "rural": "Ballarat travel to Parkville; Regional travel to Shepparton", "costs": "TBC", "pairs": "Sexual Health in Clinical Contexts 1 and 3.", "prep": "", "link": ""}, {"id": "D2-RESEARCH", "name": "Translational Medicine", "years": ["MD2"], "type": "Discovery Topic", "status": "Available", "desc": "In this topic students will link clinical practice to translational science, with deeper case complexity commensurate with growing clinical understanding. Students will draw on their growing competence in clinical medicine, history-taking and examination to identify a relevant clinical case and then to research and synthesis aspects of translational medicine related to that patient case.\n\nCases will be presented as part of the assessments and the most outstanding of these will be supported for preparation submission to a journal for publication.\n\nAs an additional part of the topic, the top three students (per term) will also be given the opportunity to present their work at the Royal Melbourne Hospital Grand rounds. This is in addition to the support provided for publication.", "tags": ["Research & research translation"], "mode": "In person", "location": "Parkville and metro placement", "sites": ["Parkville", "Metro placement / site"], "period": "MD2 4-week Discovery term (TBC)", "commitment": "All students are required to attend the Parkville precinct for 1 x 4 hour orientation session on Day 1 and also at the end of the second week for the oral presentation day. Students will be required to attend a metro hospital to clerk their patient case. Students are also expected to shadow their mentor during selected activities over the 4 week period (the exact activities will be negotiated between the mentor and the student). Attempts are made to allocate students to mentors from their own clinical site where possible.", "assessment": "Oral case presentation; Written case report; Reflective portfolio", "prereq": "None", "travel": "To Parkville", "rural": "Travel to Parkville", "costs": "", "pairs": "Reviewing and Communicating Research", "prep": "", "link": ""}, {"id": "D2-WTGGT", "name": "When the Going Gets Tough", "years": ["MD2"], "type": "Discovery Topic", "status": "Available", "desc": "When the Going Gets Tough the Tough Get Going. Right?  Eighties hits aside, it remains true that people are expected to keep going when life throws obstacles in their way – from everyday stressors to complex trauma.  But as we know, not everyone keeps going – sometimes there aren’t the resources, or the skills.  Or sometimes the way a person “gets going” again inevitably causes them further damage.\n\nIn this topic, we will look at the kinds of tough experiences that people live with – especially the clinical aspects of psychological trauma. We will examine its prevalence and the factors shaping its development across individual, community, sociopolitical, and planetary contexts. We will also consider the different strategies people use to adapt to these difficult emotions, both helpful and ultimately unhelpful, and why a person may adopt such a strategy.\n\nBy completing this subject, students will gain a better understanding of the range of clinical features and presentations trauma can take, and develop key skills around communication and trauma-informed care. Students will also develop an ability to place adaptive and maladaptive coping strategies into context, recognising risk factors and strategies which may support people to find healthier, more successful ways to cope.  Finally, it will also allow them to reflect on the ways in which their own experiences and coping strategies may impact on their work as clinicians.", "tags": ["Mental health & psychiatry", "Trauma-informed care"], "mode": "In person", "location": "Parkville and metro placement", "sites": ["Parkville", "Metro placement / site"], "period": "MD2 4-week Discovery term (TBC)", "commitment": "Students will participate in small group supervision, interview-skills development, and lived and living experience workshops, complemented by sessions with guest trauma specialists. These learning experiences are designed to help students build confidence and competence in engaging with individuals experiencing mental distress and to apply trauma-informed principles in real-world contexts.\n\nStudents will undertake clinical placements in general wards in their clinical school, mental health and community alcohol and other drug settings, gaining practical experience and exposure to diverse models of care.\n\nTeaching is face to face. Hybrid teaching will be considered for rural students but face to face supervision and attendance weekly is preferred, to support learning from the content to be discussed. Face to face teaching will commence later in the morning to accommodate rural student attendance when recommended, which is for the four Fridays.  Delivery of content in a rural setting will depend on cohort numbers.", "assessment": "Identifying trauma presentation; Substance use written assignment; Reflective portfolio", "prereq": "None", "travel": "Multiple placement sites", "rural": "Travel to Parkville (preferred)", "costs": "", "pairs": "", "prep": "", "link": ""}, {"id": "D3-CANCER", "name": "Advances in Cancer Diagnostics", "years": ["MD3"], "type": "Discovery Topic", "status": "Available", "desc": "Clinicians utilise a vast array of diagnostic tools and techniques to help in cancer diagnosis. Over the last few decades, there has been an accelerated progress in novel diagnostic tools that have revolutionised our approaches to accurate, efficient and cost-effective cancer diagnosis.  In this subject, students will learn about some of the most exciting advances in cancer diagnostics, from cutting-edge molecular techniques to artificial intelligence, using simulated approach with clinical scenarios and real-life examples to demonstrate the utility of these techniques.", "tags": ["Oncology & cancer care"], "mode": "Blended", "location": "Online and metro placement", "sites": ["Online", "Metro placement / site"], "period": "MD3 4-week Discovery term (TBC)", "commitment": "The course is suitable for both rural and metropolitan students. Synchronous teaching sessions will be online to permit equitable access for students regardless of location.  There are 4 x 2.5 hour online tutorials, and 4 one-day placements, spread across the 4 weeks of the subject. These include 2 clinical placements (in a pathology and a radiology department), as well as a pathology museum placement and a symposium. Students are expected to attend these 4 placements in person. Placements will be available in metropolitan Melbourne and if possible, in other centres.", "assessment": "Recorded presentation; Written essay; Learning reflection", "prereq": "None", "travel": "To Parkville and multiple placement sites", "rural": "Travel to Parkville and metro sites", "costs": "", "pairs": "", "prep": "", "link": ""}, {"id": "D3-SURGERY", "name": "Immersion in Robotic Surgery", "years": ["MD3"], "type": "Discovery Topic", "status": "Available", "desc": "Step into the future of healthcare with Immersion in Robotic Surgery - an innovative subject that brings robotic-assisted surgery to life through virtual reality, hands-on simulation, and surgical anatomy exploration. Developed in collaboration with the International Medical Robotics Academy, this program combines modern technology with practical, team-based learning to help students understand how robotics is transforming surgical practice and patient care. Whether you’re surgery-inclined or simply curious about how emerging technologies are reshaping medicine, this subject offers a unique and engaging experience at the cutting edge of clinical education.\n\nThis subject introduces medical students to the science, systems, and skills underpinning robotic-assisted surgery. It is designed for all medical students - not only those pursuing a surgical career - to enhance understanding of how robotic technologies integrate with anatomy, clinical reasoning, and healthcare delivery.\n\nThrough a blend of online, simulated, and in-person learning, students gain foundational knowledge and practical insight into robotic surgical principles, operative workflows, and human-factors teamwork. Learning experiences include narrated surgical recordings, virtual reality console simulation and structured workshops focused on both technical and non-technical skills.", "tags": ["Surgical & procedural skills"], "mode": "Blended", "location": "Parkville and external site", "sites": ["Parkville", "External site"], "period": "MD3 4-week Discovery term (TBC)", "commitment": "Students participate in a mix of asynchronous online modules and in person workshops which are held at the International Medical Robotics Academy in metropolitan Melbourne.\n\nLocal students are encouraged to attend on-site for the weekly synchronous sessions as well as the oral assessment on Friday of week 2. Rural students will be able to participate online. \n\nA highlight of the subject is the two-day on-site workshop in Week 3, where students apply their learning through hands-on technical training and immersive non-technical skills sessions. This includes bedside assisting, instrument handling, docking and undocking, as well as team-based simulations and structured debriefing. All students must attend in person for this workshop.", "assessment": "Oral presentation; Written assignment; Reflective piece", "prereq": "None", "travel": "Within metro, Rural students to metro", "rural": "Travel to metro site", "costs": "", "pairs": "", "prep": "", "link": ""}, {"id": "D3-RURAL", "name": "Integrating Rural Health", "years": ["MD3"], "type": "Discovery Topic", "status": "Available", "desc": "The Rural Health MD Discovery 3 program will provide students with the opportunity for a detailed exploration of the disparities in healthcare access in a rural setting. The subject will explore Rural Generalism as a specialization and implications for healthcare in Australia (and training pathways). Students will gain an understanding of the skills involved underlying the Rural Generalist scope of practice such as primary care, obstetrics, anaesthetics, mental health services and emergency medicine.\n\nAll teaching will be centred around weekly cases, based on emergency medicine, primary care, and hospital based care. These cases will provide students with an in depth understanding of the role of the Rural Generalist in each of these contexts with specific clinically relevant tutorials tailored for each case.", "tags": ["Rural & regional health"], "mode": "In person", "location": "Wangaratta and rural placement", "sites": ["Wangaratta", "Rural placement / site"], "period": "MD3 4-week Discovery term (TBC)", "commitment": "Teaching and learning activities for this topic include a mix of synchronous and asynchronous online materials, placement activities (on-site locations) and independent learning.\n\nAll students will complete a full day workshop in Week 1 at Wangaratta, followed by 6 x 2 hour tutorials synchronously online and 1 full week of placement at a range of rural health services.", "assessment": "Written opinion piece; Oral presentations; Placement reflection", "prereq": "None", "travel": "To regional sites", "rural": "Travel to Wangaratta", "costs": "", "pairs": "", "prep": "", "link": ""}, {"id": "D3-DISABILITY", "name": "Developmental Disability: Life Span Approaches to Health Care", "years": ["MD3"], "type": "Discovery Topic", "status": "Available", "desc": "This topic uses contemporary theory and knowledge to focus on the provision of health care for those with childhood onset life-long disability. Students will gain knowledge about medical, social and biopsychosocial models of disability and understand the range of systems-level impacts on outcomes. The focus in this topic will be on people with neurodevelopmental disability (for example cerebral palsy, autism, intellectual disability, traumatic brain injury or childhood stroke). Students will explore associated health conditions and assessment needs at different life stages; consider life-long impacts of neurodevelopmental disability on the child and family; the impact of culture and place on the intersection between disability and health care service provision; and low and high technical solutions to health care needs.", "tags": ["Disability & equity"], "mode": "Blended", "location": "Online, metro placement and rural placement", "sites": ["Online", "Metro placement / site", "Rural placement / site"], "period": "MD3 4-week Discovery term (TBC)", "commitment": "Students will be expected to attend online tutorials (for 4 weeks).\n\nStudents will attend up to 4 days of placement in the final week of the Discovery term. In placement week, they will also attend a lived experience panel.   Where possible clinical placements will be arranged locally for students in Melbourne, Ballarat, and Shepparton, however this will depend on availability of suitable placements at the time and some travel will be required.", "assessment": "Disability Royal Commission presentation; Public Health resource written assignment; Reflective essay", "prereq": "None", "travel": "To be confirmed", "rural": "To be confirmed", "costs": "", "pairs": "", "prep": "", "link": ""}, {"id": "D3-MEDHUM", "name": "Medical Humanities", "years": ["MD3"], "type": "Discovery Topic", "status": "Available", "desc": "This topic brings together medical science, creativity and the arts for a socially engaged approach to health and wellbeing. Using perspectives drawn from the humanities as a 'lens' through which to consider medicine and medical identity, and using examples from the Arts (visual arts, music, performance, multimedia arts, literary texts, etc) as core resources, the topic offers a variety of activities, including group site visits to cultural venues. Through the topic, key skills are identified and practiced, and diverse perspectives are explored, with the interdisciplinary topic leads supporting the integration of these experiences into medical contexts, with scholarly and reflective outcomes.", "tags": ["Health humanities"], "mode": "Blended", "location": "Online and external sites (metro and rural).", "sites": ["Online", "Metro placement / site", "Rural placement / site", "External site"], "period": "MD3 4-week Discovery term (TBC)", "commitment": "Teaching and learning activities will be online synchronous and asynchronous during the first 4 days of each week. Students will travel to various sites for the full day of in person activity on Friday of each week. These sites will include metropolitan Melbourne and one regional location.", "assessment": "Observation skills presentation; Blog and peer commentary written assignment; Reflective portfolio", "prereq": "None", "travel": "Within metro, to regional sites", "rural": "Travel to metro and regional sites", "costs": "", "pairs": "", "prep": "", "link": ""}, {"id": "D3-SEXHEALTH", "name": "Sexual Health Across Clinical Contexts 3", "years": ["MD3"], "type": "Discovery Topic", "status": "Available", "desc": "Sexual Health Across Clinical Contexts (SHACC)3 builds on aspects of Sexual health care covered in SHACC 1 & 2 but can also be taken as an independent course at the Discovery Integration level.\n\nThe topic has a clinical focus, developing sexual health care knowledge and skills beyond core teachings.  The areas covered will include:\n- Clinical experience in specialised Sexual Health services or high case load general practice in both metropolitan and rural locations\n- In depth knowledge of Long-Acting Reversible Contraception (LARC)\n- Certification as an Implanon provider (usable independently upon registration)\n- Commencement training in IUDs provision\n- Learning to be Early Medical Abortion (EMA) provider\n- Gaining greater understanding of the impact of coercion and non-consensual sex\n- Deepening knowledge of impacts of disability, aging and sexual health\n- Exploring Relationships and sexuality education (RSE)", "tags": ["Sexual & reproductive health", "Clinical and communication skills"], "mode": "In person", "location": "Parkville, Shepparton, metro placement and rural placement", "sites": ["Parkville", "Shepparton", "Metro placement / site", "Rural placement / site"], "period": "MD3 4-week Discovery term (TBC)", "commitment": "Sexual Health Across Clinical Contexts (SHACC) is taught with a combination of learning styles. In person (on campus) workshops and tutorials are spread across the topic with 3 weeks of face-to-face learning and 1 week of clinical placement.\n\nIn person learning will be provided in Parkville for metropolitan students and in Shepparton for all rural students. Rural students who do not normally reside in Shepparton will be supported to attend Shepparton. Timetabling is set to attempt to have rural students attending Shepparton for classes on consecutive days to minimise travel. The clinical placements will be located in either metropolitan or rural settings. All effort will be made for your placement to be at a location of choice- this may not always be possible.\n\nOther learning is online and will be directed and self-paced throughout the topic.", "assessment": "Professional certification: Implanon; EMA Video Case Study; Reflective assessment", "prereq": "Students who have not completed SHACC in MD1 or MD2 will be required to undertake prerequisite learning prior to commencing this topic (up to ten hours).", "travel": "To Parkville or Shepparton", "rural": "Ballarat travel to Parkville; Regional travel to Shepparton", "costs": "", "pairs": "", "prep": "", "link": ""}, {"id": "HLTH90021", "name": "Biomedical Enterprise Research to Impact", "years": ["MD1", "MD2"], "type": "Faculty Selective", "status": "Available", "desc": "This subject will offer students a foundation in developing a biomedical research discovery into a new therapeutic approach.", "tags": ["Research & research translation"], "mode": "In person", "location": "Parkville", "sites": ["Parkville"], "period": "Semester 1", "commitment": "Workshops, masterclasses, webinars and supporting resources across Semester 1", "assessment": "Case study; online discussion participation; group written translation strategy; pitch and slide deck; individual self-assessment and team evaluation", "prereq": "No prerequisite is specified on the 2026 Handbook page", "travel": "Travel to Parkville for on-campus teaching", "rural": "Parkville on-campus attendance; no online offering is listed", "costs": "See Handbook fees information", "pairs": "None stated in Handbook", "prep": "May support further learning in research translation, therapeutic development, intellectual property and biomedical enterprise", "link": "https://handbook.unimelb.edu.au/subjects/hlth90021"}, {"id": "POPH90088", "name": "Disability in Policy and Practice", "years": ["MD1", "MD2"], "type": "Faculty Selective", "status": "Available", "desc": "Drawing on practitioner experience, including from people with disability themselves, this course will provide you with a foundation for critically considering issues of equity, representation, intersectionality, and meaningful participation.", "tags": ["Public health & policy", "Disability & equity"], "mode": "Blended", "location": "Online or Parkville", "sites": ["Online", "Parkville"], "period": "June", "commitment": "Short-course delivery with online or Parkville participation; see Handbook dates and timetable", "assessment": "Introductory post (hurdle); recorded group presentation; policy brief; essay", "prereq": "None", "travel": "Travel to Parkville only if selecting the on-campus offering", "rural": "Online offering available", "costs": "See Handbook fees information", "pairs": "None stated in Handbook", "prep": "May support further learning in disability-inclusive health, development, policy and practice", "link": "https://handbook.unimelb.edu.au/subjects/poph90088"}, {"id": "BINF90002", "name": "Elements of Bioinformatics", "years": ["MD1", "MD2"], "type": "Faculty Selective", "status": "Available", "desc": "This subject presents bioinformatics in the context of its role in science, using examples from a variety of fields to illustrate the history, current status, and future directions of bioinformatics research and practice.", "tags": ["Research & research translation"], "mode": "In person", "location": "Parkville", "sites": ["Parkville"], "period": "Semester 1", "commitment": "On-campus teaching across Semester 1; see Handbook dates and timetable", "assessment": "Essay; two workshop assignments; critical review; final examination (hurdle)", "prereq": "No prerequisite is specified on the 2026 Handbook page", "travel": "Travel to Parkville", "rural": "Parkville on-campus attendance; no online offering is listed", "costs": "See Handbook fees information", "pairs": "None stated in Handbook", "prep": "May support further learning in bioinformatics, biomedical data analysis and research", "link": "https://handbook.unimelb.edu.au/2026/subjects/binf90002"}, {"id": "POPH90309", "name": "Environmental Health", "years": ["MD1", "MD2"], "type": "Faculty Selective", "status": "Available", "desc": "This subject explores the complex relationship between the environment and the social, emotional, and physical health of people and how these can be matched by effective policy and action.", "tags": ["Global & planetary health"], "mode": "Blended", "location": "Online or Parkville", "sites": ["Online", "Parkville"], "period": "March", "commitment": "March intensive delivery with online or Parkville participation; see Handbook dates and timetable", "assessment": "Discussion board introduction (hurdle); written reflection; written analysis; presentation; written report", "prereq": "None", "travel": "Travel to Parkville only if selecting the on-campus offering", "rural": "Online offering available", "costs": "See Handbook fees information", "pairs": "None stated in Handbook", "prep": "May support further learning in environmental health risk assessment, policy and systems approaches", "link": "https://handbook.unimelb.edu.au/subjects/poph90309"}, {"id": "POPH90244", "name": "Health and Human Rights", "years": ["MD1", "MD2"], "type": "Faculty Selective", "status": "Available", "desc": "This interdisciplinary subject examines the right to health and related rights, and how rights-based approaches in law, policy, programs and advocacy can improve the health and wellbeing of diverse groups, including children, women, Indigenous people, people with mental illness or disability, and refugees and asylum seekers.", "tags": ["Public health & policy"], "mode": "Blended", "location": "Online or Parkville", "sites": ["Online", "Parkville"], "period": "April", "commitment": "Six-week dual-delivery block: self-directed online modules plus weekly live interactive sessions; approximately 80 hours over six weeks, followed by assessment work", "assessment": "Introductory post (hurdle); pre-recorded group presentation and written Q&A; opinion editorial; essay", "prereq": "No prerequisite is specified on the 2026 Handbook page", "travel": "Travel to Parkville only if selecting face-to-face live sessions", "rural": "Online attendance option available", "costs": "See Handbook fees information", "pairs": "None stated in Handbook", "prep": "May support further learning in human rights, global health, health policy and advocacy", "link": "https://handbook.unimelb.edu.au/subjects/poph90244"}, {"id": "POPH90206", "name": "Health Policy", "years": ["MD1", "MD2"], "type": "Faculty Selective", "status": "Available", "desc": "This subject explores the government policy decisions that set national and regional objectives for health services, programs and the broader environments that shape population health and wellbeing.", "tags": ["Public health & policy"], "mode": "Blended", "location": "Online or Parkville", "sites": ["Online", "Parkville"], "period": "Semester 1", "commitment": "Semester 1 delivery online or on campus; see Handbook dates and timetable", "assessment": "Two written essays", "prereq": "None. Non-allowed: POPH90023 Health and Public Policy", "travel": "Travel to Parkville only if selecting the on-campus offering", "rural": "Online offering available", "costs": "See Handbook fees information", "pairs": "None stated in Handbook", "prep": "May support further learning in health policy analysis, policy development and implementation", "link": "https://handbook.unimelb.edu.au/subjects/poph90206"}, {"id": "POPH90058", "name": "Health Program Evaluation 1", "years": ["MD1", "MD2"], "type": "Faculty Selective", "status": "Available", "desc": "Using Australian and international examples, this subject explores the purposes, settings and key approaches of health program evaluation across planning, data collection and analysis, and reporting, with students applying these skills to develop an evaluation plan for a real work-based program.", "tags": ["Research & research translation", "Public health & policy"], "mode": "Blended", "location": "Online or Parkville", "sites": ["Online", "Parkville"], "period": "Semester 1", "commitment": "Semester 1 delivery online or on campus; see Handbook dates and timetable", "assessment": "Two minor written assignments; major evaluation plan", "prereq": "None", "travel": "Travel to Parkville only if selecting the on-campus offering", "rural": "Online offering available", "costs": "See Handbook fees information", "pairs": "None stated in Handbook", "prep": "May support further learning in health program evaluation, evaluation design and applied research", "link": "https://handbook.unimelb.edu.au/subjects/poph90058"}, {"id": "POPH90231", "name": "Qualitative Research in Public Health", "years": ["MD1", "MD2"], "type": "Faculty Selective", "status": "Available", "desc": "A compulsory subject in the Master of Public Health, this subject introduces the principles, methods and analysis of qualitative research, from interviews to visual and participatory approaches, so students can design, plan and evaluate qualitative studies as evidence for public health practice.", "tags": ["Research & research translation", "Public health & policy"], "mode": "Blended", "location": "Online or Parkville", "sites": ["Online", "Parkville"], "period": "Semester 1 or Semester 2", "commitment": "Semester delivery online or on campus; see Handbook dates and timetable", "assessment": "Short-answer written assignment; research proposal; critical reflection", "prereq": "None", "travel": "Travel to Parkville only if selecting the on-campus offering", "rural": "Online offering available in both semesters", "costs": "See Handbook fees information", "pairs": "None stated in Handbook", "prep": "May support further learning in qualitative research design, data collection and analysis", "link": "https://handbook.unimelb.edu.au/subjects/poph90231"}, {"id": "POPH90013", "name": "Biostatistics", "years": ["MD1", "MD2"], "type": "Faculty Selective", "status": "Available", "desc": "This subject, compulsory for the Master of Public Health, Master of Epidemiology and Master of Science (Epidemiology), introduces the fundamental statistical concepts and methods needed to perform basic analyses and interpret research findings in public health.", "tags": ["Research & research translation", "Public health & policy"], "mode": "Blended", "location": "Onl us": "Available", "desc": "This subject examines the epidemiology, determinants, consequences and global responses to non-communicable diseases, a major health and development challenge particularly in low and middle income countries and the Pacific, equipping students to address them through policy, programs and advocacy in Australia and globally.", "tags": ["Global & planetary health"], "mode": "Blended", "location": "Online or Parkville", "sites": ["Online", "Parkville"], "period": "July", "commitment": "Two-week dual-delivery intensive with self-directed online modules and live sessions on six days; approximately 40 hours per week, followed by six weeks for assessment", "assessment": "See Handbook assessment page", "prereq": "See Handbook eligibility and requirements", "travel": "Travel to Parkville only if selecting face-to-face live sessions", "rural": "Online attendance option available", "costs": "See Handbook fees information", "pairs": "None stated in Handbook", "prep": "May support further learning in global health, non-communicable disease policy, programs and advocacy", "link": "https://handbook.unimelb.edu.au/subjects/poph90247"}, {"id": "POPH90230", "name": "Planetary and Global Health", "years": ["MD1", "MD2"], "type": "Faculty Selective", "status": "Available", "desc": "This subject explores five interrelated planetary health threats (climate change, sanitation and water security, nuclear weapons, air pollution and COVID-19), examining their impacts on population health and critiquing the policies, international agreements and complex systems involved in responding to them at local, national and global scales.", "tags": ["Global & planetary health"], "mode": "Blended", "location": "Online or Parkville", "sites": ["Online", "Parkville"], "period": "July", "commitment": "Two-week dual-delivery intensive with self-directed online modules and live sessions on six days; approximately 40 hours per week, followed by four weeks for assessment", "assessment": "See Handbook assessment page", "prereq": "See Handbook eligibility and requirements", "travel": "Travel to Parkville only if selecting face-to-face live sessions", "rural": "Online attendance option available", "costs": "See Handbook fees information", "pairs": "None stated in Handbook", "prep": "May support further learning in planetary health, environmental health policy and global systems", "link": "https://handbook.unimelb.edu.au/subjects/poph90230"}, {"id": "POPH90304", "name": "Sustainability and Healthcare", "years": ["MD1", "MD2"], "type": "Faculty Selective", "status": "Available", "desc": "This subject explores healthcare’s role in causing, being affected by and addressing climate change, focusing on sustainable practice, adaptation and mitigation strategies, and links to health equity.", "tags": ["Global & planetary health"], "mode": "Blended", "location": "Online or Parkville", "sites": ["Online", "Parkville"], "period": "May", "commitment": "May intensive delivery online or on campus; see Handbook dates and timetable", "assessment": "See Handbook assessment page", "prereq": "See Handbook eligibility and requirements", "travel": "Travel to Parkville only if selecting the on-campus offering", "rural": "Online offering available", "costs": "See Handbook fees information", "pairs": "None stated in Handbook", "prep": "May support further learning in sustainable healthcare, climate adaptation and mitigation, and health systems change", "link": "https://handbook.unimelb.edu.au/subjects/poph90304"}, {"id": "POPH90199", "name": "Gender and Health", "years": ["MD2"], "type": "Faculty Selective", "status": "Available", "desc": "In this subject, students will develop an understanding of gender as a social construct distinct from biological sex and explore the role of gender in shaping health inequities.", "tags": ["Women's health & O&G", "Public health & policy"], "mode": "Blended", "location": "Online or Parkville", "sites": ["Online", "Parkville"], "period": "Semester 1", "commitment": "Semester 1 delivery online or on campus; see Handbook dates and timetable", "assessment": "See Handbook assessment page", "prereq": "See Handbook eligibility and requirements", "travel": "Travel to Parkville only if selecting the on-campus offering", "rural": "Online offering available", "costs": "See Handbook fees information", "pairs": "None stated in Handbook", "prep": "May support further learning in gender analysis, health equity, health promotion and policy", "link": "https://handbook.unimelb.edu.au/subjects/poph90199"}, {"id": "POPH90257", "name": "Body of Ageing", "years": ["MD2"], "type": "Faculty Selective", "status": "Available", "desc": "This subject focuses on how the body and its systems are affected by ageing and explores the differences between the natural ageing process and physical changes that develop as a result of illness with older persons.", "tags": ["Ageing & aged care"], "mode": "Online", "location": "Online", "sites": ["Online"], "period": "Term 3", "commitment": "Online Term 3 delivery; see Handbook dates and timetable", "assessment": "See Handbook assessment page", "prereq": "See Handbook eligibility and requirements", "travel": "None for online delivery", "rural": "Online delivery available", "costs": "See Handbook fees information", "pairs": "None stated in Handbook", "prep": "May support further learning in healthy ageing, disease prevention and older-person care", "link": "https://handbook.unimelb.edu.au/subjects/poph90257"}], "tagCategories": {"Clinical / specialty interest": ["Oncology & cancer care", "Emergency & disaster medicine", "Rural & regional health", "First Nations health", "Sexual & reproductive health", "Women's health & O&G", "Disability & equity", "Palliative & end-of-life care", "Surgical & procedural skills", "Trauma-informed care", "Mental health & psychiatry", "General Practice & primary care", "Global & planetary health", "Ageing & aged care"], "Practice orientation / skills": ["Research & research translation", "Medical education & teaching", "Health humanities", "Health systems & care coordination", "Public health & policy", "Digital health & informatics", "Clinical and communication skills"]}, "built": "23 October 2026"};
const YEARS = ["MD1","MD2","MD3"];
const MAX_CMP = 3;
const FIELDS = [
  ["type","Option type"],["period","Teaching period"],["mode","Delivery mode"],["location","Location / sites"],
  ["commitment","Teaching & learning commitment"],["assessment","Assessment"],["prereq","Prerequisites / eligibility"],
  ["travel","Travel required"],["rural","Rural students"],["costs","Costs"],["pairs","Pairs well with"],
  ["prep","Useful preparation for"],["tags","Interests"]
];
const S = {year:"MD1", q:"", type:new Set(), mode:new Set(), site:new Set(), tags:new Set(), cmp:[]};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// Restore year from URL hash so each Canvas page can deep-link, e.g. finder.html#MD2
let h = ""; try { h = location.hash; } catch(e) {}
h = h.replace("#","").toUpperCase();
if (YEARS.includes(h)) S.year = h;

// Updating the address bar is a nice-to-have (deep links). Sandboxed frames such as
// SharePoint/Canvas previews forbid it, so never let it break the page.
function setHash(y){ try { history.replaceState(null,"","#"+y); } catch(e) {} }

const inYear = () => DATA.options.filter(o => o.years.includes(S.year));
function matches(o, skip){
  if (S.q){
    const hay = [o.name,o.desc,o.tags.join(" "),o.location,o.assessment,o.id].join(" ").toLowerCase();
    if (!S.q.toLowerCase().split(/\s+/).every(w => hay.includes(w))) return false;
  }
  if (skip!=="type" && S.type.size && !S.type.has(o.type)) return false;
  if (skip!=="mode" && S.mode.size && !S.mode.has(o.mode)) return false;
  if (skip!=="site" && S.site.size && !o.sites.some(s => S.site.has(s))) return false;
  if (skip!=="tags" && S.tags.size && !o.tags.some(t => S.tags.has(t))) return false;
  return true;
}
function facet(key, values, el, getVals){
  const base = inYear();
  el.innerHTML = values.map(v => {
    const n = base.filter(o => matches(o,key) && getVals(o).includes(v)).length;
    const on = S[key].has(v);
    return `<button type="button" class="chip" aria-pressed="${on}" data-k="${key}" data-v="${esc(v)}" ${!n && !on ? "disabled":""}>${esc(v)}<span class="c">${n}</span></button>`;
  }).join("");
}
function renderYears(){
  $("years").innerHTML = YEARS.map(y => {
    const n = DATA.options.filter(o => o.years.includes(y)).length;
    return `<button role="tab" type="button" aria-selected="${y===S.year}" data-y="${y}">${y}<span class="n">(${n})</span></button>`;
  }).join("");
}
function renderFilters(){
  const base = inYear();
  const uniq = f => [...new Set(base.flatMap(f))].sort();
  facet("type", uniq(o=>[o.type]), $("f-type"), o=>[o.type]);
  const modeOrder = ["Online","Blended","In person","See handbook","To be confirmed"];
  facet("mode", uniq(o=>[o.mode]).sort((a,b)=>modeOrder.indexOf(a)-modeOrder.indexOf(b)), $("f-mode"), o=>[o.mode]);
  const siteOrder = ["Online","Parkville","Shepparton","Wangaratta","Metro placement / site","Rural placement / site","External site"];
  facet("site", uniq(o=>o.sites).sort((a,b)=>siteOrder.indexOf(a)-siteOrder.indexOf(b)), $("f-site"), o=>o.sites);
  const present = new Set(base.flatMap(o=>o.tags));
  const wrap = $("f-tags"); wrap.innerHTML = "";
  const cats = Object.entries(DATA.tagCategories);
  const known = new Set(cats.flatMap(([,t])=>t));
  const extra = [...present].filter(t=>!known.has(t));
  if (extra.length) cats.push(["Other", extra]);
  for (const [cat, tags] of cats){
    const list = tags.filter(t=>present.has(t)).sort();
    if (!list.length) continue;
    const d = document.createElement("div");
    d.innerHTML = `<div class="subleg">${esc(cat)}</div><div class="chips"></div>`;
    facet("tags", list, d.lastElementChild, o=>o.tags);
    wrap.appendChild(d);
  }
}
function typeClass(t){ return /selective/i.test(t) ? "fs" : "dt"; }
function card(o){
  const sel = S.cmp.includes(o.id);
  const full = S.cmp.length >= MAX_CMP && !sel;
  const status = o.status && o.status !== "Available" ? `<span class="pill tbc">${esc(o.status)}</span>` : "";
  const facts = [["When",o.period],["Mode",o.mode],["Where",o.location]].filter(f=>f[1])
    .map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join("");
  return `<article class="card${sel?" sel":""}">
    <div class="ch">
      <div class="meta"><span class="pill ${typeClass(o.type)}">${esc(o.type)}</span>${o.years.length>1?`<span class="pill">${esc(o.years.join(" / "))}</span>`:""}${status}</div>
      <h3>${esc(o.name)}</h3>
      ${facts?`<dl class="facts">${facts}</dl>`:""}
      <p class="desc">${esc(o.desc)}</p>
      <div class="tags">${o.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
    </div>
    <div class="cf">
      <button class="btn" type="button" data-detail="${esc(o.id)}">Details</button>
      <label class="cmp"><input type="checkbox" data-cmp="${esc(o.id)}" ${sel?"checked":""} ${full?"disabled":""}> Compare</label>
    </div>
  </article>`;
}
function render(){
  renderYears(); renderFilters();
  const list = inYear().filter(o=>matches(o)).sort((a,b)=>a.type.localeCompare(b.type)||a.name.localeCompare(b.name));
  const total = inYear().length;
  $("count").innerHTML = `Showing <b>${list.length}</b> of ${total} ${S.year} options`;
  $("grid").innerHTML = list.length ? list.map(card).join("")
    : `<div class="empty">No ${S.year} options match these filters. <button class="reset" type="button" data-reset>Clear filters</button></div>`;
  renderTray();
}
function renderTray(){
  const sel = S.cmp.map(id=>DATA.options.find(o=>o.id===id)).filter(Boolean);
  $("tray").classList.toggle("on", sel.length>0);
  $("trayNames").innerHTML = `<b>${sel.length}/${MAX_CMP} selected:</b> ${sel.map(o=>esc(o.name)).join(" · ")}`;
  $("openCmp").disabled = sel.length < 2;
  $("openCmp").textContent = sel.length < 2 ? "Select 2+ to compare" : `Compare ${sel.length}`;
}
function fieldVal(o,k){
  const v = k==="tags" ? o.tags.join(", ") : o[k];
  return v ? esc(v) : `<span class="muted">—</span>`;
}
function linkFor(o){ return o.link ? `<a href="${esc(o.link)}" target="_blank" rel="noopener">More information ↗</a>` : ""; }
function openDetail(id){
  const o = DATA.options.find(x=>x.id===id); if(!o) return;
  $("dlgTitle").textContent = o.name;
  $("dlgBody").innerHTML = `<div class="detail">
    <div class="meta" style="margin-top:14px"><span class="pill ${typeClass(o.type)}">${esc(o.type)}</span><span class="pill">${esc(o.years.join(" / "))}</span>${o.status!=="Available"?`<span class="pill tbc">${esc(o.status)}</span>`:""}</div>
    ${o.desc?`<h4>About</h4><p>${esc(o.desc)}</p>`:""}
    ${FIELDS.filter(([k])=>k!=="type" && (k==="tags"?o.tags.length:o[k])).map(([k,l])=>`<h4>${l}</h4><p>${fieldVal(o,k)}</p>`).join("")}
    ${o.link?`<h4>Find out more</h4><p>${linkFor(o)}</p>`:""}
  </div>`;
  $("dlg").showModal();
}
function openCompare(){
  const sel = S.cmp.map(id=>DATA.options.find(o=>o.id===id)).filter(Boolean);
  if (sel.length<2) return;
  $("dlgTitle").textContent = `Comparing ${sel.length} options`;
  const rows = [...FIELDS,["desc","About"]];
  $("dlgBody").innerHTML = `<table class="ct">
    <thead><tr><th scope="col"><span class="sr">Field</span></th>${sel.map(o=>`<th scope="col">${esc(o.name)}</th>`).join("")}</tr></thead>
    <tbody>${rows.filter(([k])=>sel.some(o=>k==="tags"?o.tags.length:o[k])).map(([k,l])=>`<tr><th scope="row">${l}</th>${sel.map(o=>`<td>${fieldVal(o,k)}</td>`).join("")}</tr>`).join("")}
    <tr><th scope="row">More information</th>${sel.map(o=>`<td>${linkFor(o)||'<span class="muted">—</span>'}</td>`).join("")}</tr>
    </tbody></table>`;
  $("dlg").showModal();
}

document.addEventListener("click", e => {
  const t = e.target.closest("button,[data-cmp]"); if (!t) return;
  if (t.dataset.y){ S.year=t.dataset.y; S.type.clear();S.mode.clear();S.site.clear();S.tags.clear(); setHash(S.year); render(); }
  else if (t.dataset.k){ const s=S[t.dataset.k]; s.has(t.dataset.v)?s.delete(t.dataset.v):s.add(t.dataset.v); render(); }
  else if (t.dataset.detail) openDetail(t.dataset.detail);
  else if (t.id==="reset" || "reset" in t.dataset){ S.q="";$("q").value="";S.type.clear();S.mode.clear();S.site.clear();S.tags.clear(); render(); }
});
document.addEventListener("change", e => {
  const id = e.target.dataset.cmp; if (!id) return;
  S.cmp = e.target.checked ? [...S.cmp,id].slice(0,MAX_CMP) : S.cmp.filter(x=>x!==id);
  render();
});
$("q").addEventListener("input", e => { S.q=e.target.value.trim(); render(); });
$("openCmp").onclick = openCompare;
$("clearCmp").onclick = () => { S.cmp=[]; render(); };
$("dlgClose").onclick = () => $("dlg").close();
$("dlg").addEventListener("click", e => { if (e.target===$("dlg")) $("dlg").close(); });
$("togglef").onclick = () => { const a=$("filters").classList.toggle("open"); $("togglef").setAttribute("aria-expanded",a); };
document.getElementById("years").addEventListener("keydown", e => {
  if (!["ArrowLeft","ArrowRight"].includes(e.key)) return;
  const i = YEARS.indexOf(S.year) + (e.key==="ArrowRight"?1:-1);
  if (i<0||i>=YEARS.length) return;
  S.year=YEARS[i]; setHash(S.year); render();
  document.querySelector(`[data-y="${S.year}"]`).focus();
});
$("foot").textContent = `Information current as at ${DATA.built}. The MD Handbook is the authoritative source for academic rules; where details differ, the Handbook applies.`;
render();
</script>
